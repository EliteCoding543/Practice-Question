<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            height: 40px;
            width: 300px;
            padding: 0 12px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #aaa;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: blue;
        }

        button {
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border: 1px solid black;
            border-radius: 20px;
            cursor: pointer;
            background-color: white;
        }

        button:hover {
            background-color: blue;
            color: white;
        }

        #task {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 500px;
        }

        .task-card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-card h3 {
            word-break: break-word;
        }

        .removeBtn {
            flex-shrink: 0;
            margin-left: 15px;
        }
    </style>
</head>

<body>

    <h1>Task Manager</h1>

    <div class="task-form">
        <input
            id="input"
            type="text"
            placeholder="Enter your task..."
        >

        <button id="add-task">
            Add Task
        </button>
    </div>

    <div id="task"></div>

    <script src="app.js"></script>

</body>

</html>
