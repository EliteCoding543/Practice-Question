<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANBAN BOARD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>kanban Board</h1>

        <div class="todo">
            <input id="input" type="text" placeholder="enter your task">
            <button id="btn">Add to Task</button>
        </div>

        <div style="display: flex;">
            <div id="main" draggable="true" class="prograss">Prograss</div>
            <div id="done" class="done">Done</div>
            <div id="approve" class="approve">Approve</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
